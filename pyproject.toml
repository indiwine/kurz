[project]
name = "kurz"
version = "0.1.0"
description = "Kurz — currency converter for KDE Plasma 6 KRunner (D-Bus runner)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Provided by the system (Arch: python-dbus, python-gobject); not pip-installed
# because KRunner launches the runner with /usr/bin/python3.
dependencies = []

[project.scripts]
kurz = "kurz.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
